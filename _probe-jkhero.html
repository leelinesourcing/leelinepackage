<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title></head>
<body style="margin:0">
<iframe id="f" src="/_preview-jewelry-hero.html" style="width:390px;height:900px;border:0"></iframe>
<pre id="out">running…</pre>
<script>
(async () => {
  const f = document.getElementById('f');
  await new Promise(r => f.addEventListener('load', r, {once:true}));
  await new Promise(r => setTimeout(r, 1600));
  const d = f.contentDocument, w = f.contentWindow;
  const lines = [];
  lines.push('innerWidth=' + w.innerWidth + '  docScrollW=' + d.documentElement.scrollWidth
    + '  bodyScrollW=' + d.body.scrollWidth + '  bodyClientW=' + d.body.clientWidth);
  const vw = d.documentElement.clientWidth;
  const bad = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.right > vw + 1 || r.width > vw + 1) {
      bad.push([el.tagName + '.' + (el.className && el.className.baseVal !== undefined ? el.className.baseVal : el.className),
        Math.round(r.left), Math.round(r.right), Math.round(r.width)].join(' '));
    }
  });
  lines.push('--- overflowing (' + bad.length + ') ---');
  lines.push(...bad.slice(0, 40));
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
</body></html>
